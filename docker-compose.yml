services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: automata-simulator:local
    environment:
      PORT: "10000"
    ports:
      - "${APP_PORT:-8001}:10000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
